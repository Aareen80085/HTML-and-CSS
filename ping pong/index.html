<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Pong - SVG Animation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
        }

        #game {
            background: #0f0f23;
            border: 3px solid #4a9eff;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(74, 158, 255, 0.3);
        }

        .paddle {
            fill: #4a9eff;
        }

        .ball {
            fill: #ff6b6b;
        }

        .center-line {
            stroke: #4a9eff;
            stroke-width: 2;
            stroke-dasharray: 10, 10;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <svg id="game" width="600" height="400">
        <!-- Center dashed line -->
        <line class="center-line" x1="300" y1="0" x2="300" y2="400" />

        <!-- Left Paddle with animation -->
        <rect class="paddle" id="paddleLeft" x="20" width="10" height="80" rx="5">
            <!-- Paddle moves up and down -->
            <animate attributeName="y" values="150;80;220;120;180;150" dur="4s" repeatCount="indefinite"
                calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1" />
        </rect>

        <!-- Right Paddle with animation -->
        <rect class="paddle" id="paddleRight" x="570" width="10" height="80" rx="5">
            <!-- Paddle moves up and down (offset timing) -->
            <animate attributeName="y" values="150;200;100;160;120;150" dur="4s" repeatCount="indefinite"
                calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1" />
        </rect>

        <!-- Ball with motion path animation -->
        <circle class="ball" id="ball" r="8">
            <!-- Ball follows a zig-zag path bouncing between paddles -->
            <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear" path="M 300,200 
                      L 35,120 
                      L 565,240 
                      L 35,300 
                      L 565,80 
                      L 35,200 
                      L 565,160 
                      L 35,100 
                      L 565,280 
                      L 300,200" />
            <!-- Pulsing glow effect -->
            <animate attributeName="r" values="8;10;8" dur="0.5s" repeatCount="indefinite" />
        </circle>

        <!-- Ball trail effect (decorative) -->
        <circle class="ball" r="5" opacity="0.3">
            <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear" begin="0.05s" path="M 300,200 
                      L 35,120 
                      L 565,240 
                      L 35,300 
                      L 565,80 
                      L 35,200 
                      L 565,160 
                      L 35,100 
                      L 565,280 
                      L 300,200" />
        </circle>

        <!-- Score display (decorative) -->
        <text x="250" y="40" fill="#4a9eff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">3</text>
        <text x="340" y="40" fill="#4a9eff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">2</text>
    </svg>
</body>

</html>
