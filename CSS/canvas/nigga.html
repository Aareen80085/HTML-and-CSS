<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Canvas API – All in One</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            background: #00ff66;
            border: 2px solid #000;
        }
    </style>
</head>

<body>

    <canvas id="canvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        /* ===============================
           RECTANGLES
        =============================== */
        ctx.fillStyle = "red";
        ctx.fillRect(20, 20, 100, 60);

        ctx.strokeStyle = "blue";
        ctx.lineWidth = 4;
        ctx.strokeRect(140, 20, 100, 60);

        ctx.clearRect(180, 40, 30, 30);

        /* ===============================
           LINES & PATHS
        =============================== */
        ctx.beginPath();
        ctx.moveTo(20, 120);
        ctx.lineTo(200, 120);
        ctx.lineTo(200, 180);
        ctx.stroke();

        /* ===============================
           CIRCLE / ARC
        =============================== */
        ctx.beginPath();
        ctx.arc(350, 150, 40, 0, Math.PI * 2);
        ctx.fillStyle = "green";
        ctx.fill();

        /* ===============================
           TEXT
        =============================== */
        ctx.font = "24px Arial";
        ctx.fillStyle = "black";
        ctx.fillText("Canvas API Demo", 20, 250);

        ctx.strokeText("Stroke Text", 20, 290);

        /* ===============================
           GRADIENT
        =============================== */
        const gradient = ctx.createLinearGradient(0, 0, 200, 0);
        gradient.addColorStop(0, "purple");
        gradient.addColorStop(1, "pink");

        ctx.fillStyle = gradient;
        ctx.fillRect(20, 320, 200, 50);

        /* ===============================
           SHADOW
        =============================== */
        ctx.shadowColor = "black";
        ctx.shadowBlur = 10;
        ctx.shadowOffsetX = 5;
        ctx.shadowOffsetY = 5;

        ctx.fillStyle = "orange";
        ctx.fillRect(260, 300, 120, 60);

        ctx.shadowBlur = 0; // reset shadow

        /* ===============================
           IMAGE
        =============================== */
        const img = new Image();
        img.src = "https://upload.wikimedia.org/wikipedia/commons/6/6a/JavaScript-logo.png";
        img.onload = () => {
            ctx.drawImage(img, 420, 260, 100, 100);
        };

        /* ===============================
           TRANSFORM
        =============================== */
        ctx.save();
        ctx.translate(650, 100);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = "cyan";
        ctx.fillRect(-30, -30, 60, 60);
        ctx.restore();

        /* ===============================
           ANIMATION
        =============================== */
        let x = 0;

        function animate() {
            ctx.clearRect(500, 350, 300, 150);

            ctx.beginPath();
            ctx.arc(520 + x, 420, 20, 0, Math.PI * 2);
            ctx.fillStyle = "blue";
            ctx.fill();

            x += 2;
            if (x > 200) x = 0;

            requestAnimationFrame(animate);
        }

        animate();
    </script>

</body>

</html>
