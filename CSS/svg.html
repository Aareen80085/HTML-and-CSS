<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG</title>
</head>

<body>
    <svg width="100" height="100">
        <circle cx="50" cy="50" r="40" fill="skyblue" />
        <text x="50" y="58" text-anchor="middle" font-size="24" fill="black"> Hello </text>
    </svg>

    <svg width="120" height="80">
        <rect x="10" y="10" width="100" height="60" fill="orange" />
    </svg>

    <svg width="120" height="60">
        <line x1="10" y1="30" x2="110" y2="30" stroke="black" stroke-width="2" />
    </svg>

    <svg width="200" height="60">
        <text x="10" y="40" font-size="24" fill="black"> Hello </text>
    </svg>
    <svg width="300" height="100">
        <rect x="20" y="20" width="200" height="120" fill="black" />
        <text x="10" y="10" font-size="24" fill="white"> Hello </text>
    </svg>
    <svg width="200" height="120">
        <polygon points="10,10 190,10 190,110 10,110" fill="teal" />
    </svg>
    <svg width="200" height="120">
        <polygon points="200,110 190,10 190,110 10,110" fill="teal" />
    </svg>
    <svg width="300" height="120" style="border: 1px solid black">
        <text x="80" y="70" font-size="30" fill="black">
            SVG
            <animate attributeName="opacity" from="0" to="1" dur="5s" repeat-counter="1" </text>
    </svg>

</html>
